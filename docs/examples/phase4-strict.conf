# nginx example: phase-4 mode "strict"
# Late interventions terminate the response. A clean HTTP 403 after headers
# have been sent is not guaranteed; clients may see a transport failure.

http {
    upstream app_backend {
        server 127.0.0.1:8081;
    }

    server {
        listen 80;
        server_name example.local;

        modsecurity on;
        modsecurity_phase4_mode strict;
        modsecurity_phase4_body_limit 1m;
        modsecurity_phase4_log /var/log/nginx/modsecurity-phase4.log;

        # Illustrative rules; adapt to your application before deployment.
        # MIME selection is configured in the engine, not in the connector.
        # Reset the MIME list in a separate engine rule load.
        modsecurity_rules 'SecResponseBodyMimeTypesClear';
        modsecurity_rules '
            SecRuleEngine On
            SecResponseBodyAccess On
            SecResponseBodyMimeType text/html text/plain application/json
            SecRule RESPONSE_BODY "@rx sensitive-marker" "id:940103,phase:4,deny,log,status:403"
        ';

        location / {
            proxy_pass http://app_backend;
        }
    }
}