# ModSecurity rules file: engine response-body MIME selection
# Load with modsecurity_rules_file alongside your other rules.
# This is not an nginx include and not a connector MIME allowlist.
# SecResponseBodyMimeTypesClear removes the engine's inherited/default list.
# Adapt this list to the response types your application needs to inspect.

SecResponseBodyAccess On
SecResponseBodyMimeTypesClear
SecResponseBodyMimeType text/html text/plain application/json application/problem+json application/xml application/xhtml+xml