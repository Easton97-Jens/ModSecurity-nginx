# nginx example: phase-4 mode "safe" (must be selected explicitly)
# Late interventions are logged as log_only. Engine, I/O, and body-budget
# failures still stop the affected response.

http {
    upstream app_backend {
        server 127.0.0.1:8081;
    }

    server {
        listen 80;
        server_name example.local;

        modsecurity on;
        modsecurity_phase4_mode safe;
        modsecurity_phase4_body_limit 1m;
        modsecurity_phase4_log /var/log/nginx/modsecurity-phase4.log;

        # Illustrative rules; adapt to your application before deployment.
        # MIME selection is configured in the engine, not in the connector.
        modsecurity_rules '
            SecRuleEngine On
            SecResponseBodyAccess On
            SecResponseBodyMimeTypesClear
            SecResponseBodyMimeType text/html text/plain application/json
            SecRule RESPONSE_BODY "@rx sensitive-marker" "id:940102,phase:4,deny,log,status:403"
        ';

        location / {
            proxy_pass http://app_backend;
        }
    }
}